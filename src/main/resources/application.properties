spring.application.name=kientv84
server.port=8080

# Config datasource postgre sql
spring.datasource.url=jdbc:postgresql://localhost:15800/demo?currentSchema=account_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#--- JPA /Hibernate ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

#--- logging
# -- log root
logging.level.root=INFO

logging.level.com.bookingcar.kientv84=DEBUG

# Log spring MVC Dispatcher
logging.level.org.springframework.web=DEBUG

spring.messages.basename=language/messages_account
spring.messages.encoding=UTF-8

# --- Cache
# --- Cache mat dinh luu cache don gian trong spring chua su dung redis (spring.cache.type=simple)
spring.cache.type=redis

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.redis.time-to-live=10000

#----- Schedule
scheduler.interval=*/5 * * * * * 
scheduler.interval.zone=Asia/Ho_Chi_Minh

# --- Openfeign
openfeign.notificationClient.name=notificationClient
openfeign.notificationClient.url.send-email=/v1/api/notifications/email
openfeign.content-type=application/json
spring.cloud.notificationClient.client.config.notificationClient.url=http://localhost:8081

#kafa group
spring.kafka.account.group=account-group


#kafa config
spring.kafka.bootstrap-servers=localhost:29092

#config producer
sspring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# config consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
#security, cho phep deserialize
spring.kafka.consumer.properties.spring.json.trusted.packages=*


#Kafka topic
spring.kafka.account.topic.created-account=com.account.created_account
spring.kafka.account.topic.account-created=com.account.account_created